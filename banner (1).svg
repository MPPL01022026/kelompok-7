      <g fill="url(#meat)"><rect x="-70" y="-17" width="30" height="34" rx="8"/><rect x="-36" y="-17" width="30" height="34" rx="8"/><rect x="-2" y="-17" width="30" height="34" rx="8"/><rect x="32" y="-17" width="30" height="34" rx="8"/></g>
